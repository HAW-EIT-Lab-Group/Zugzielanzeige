; PlatformIO project for the self-playing Pac-Man on the Zugzielanzeige panel.
;
; This is a SEPARATE, self-contained project that lives next to the original
; firmware. It reuses the original hardware definitions from ../ArduinoSketch
; (see include/pacman_config.h, which #includes ../../ArduinoSketch/header.h).
;
; Open THIS folder (Pacman/) in PlatformIO / VS Code to build & upload it.
; The repo-root platformio.ini still builds the original src/main.cpp untouched.

[env:megaatmega1280]
platform = atmelavr
board = megaatmega1280
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/NicksonYap/digitalWriteFast.git
